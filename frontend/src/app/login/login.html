<form
  #userForm="ngForm"
  (ngSubmit)="Login()"
  class="md:flex justify-center px-20 pr-50 bg-white gap-10 pt-5"
>
  <div
    class="h-auto w-3/5"
    style="
      background-image: url('register.svg');
      background-repeat: no-repeat;
      background-size: contain;
      background-color: white;
      background-position: bottom;
    "
  ></div>
  <div class="bg-white my-10 pt-5 rounded w-1/4 flex flex-col gap-3 shadow-sm drop-shadow-md">
    <div class="text-center mt-10">
      <i class="material-icons !text-5xl text-blue-950 bg-white">person</i>
      <div class="text-2xl my-2 font-medium">Login</div>
    </div>
    <div class="w-full px-3">
      <mat-form-field class="w-full mb-2" appearance="fill">
        <mat-label>Email</mat-label>
        <input
          matInput
          required
          name="email"
          [(ngModel)]="email"
          #emailModel="ngModel"
          placeholder="Email"
        />
        @if (emailModel.errors?.['required']) {
        <mat-error> Email is required </mat-error>
        }
      </mat-form-field>

      <mat-form-field class="w-full mb-2" appearance="fill">
        <mat-label>Password</mat-label>
        <input
          matInput
          name="password"
          required
          [type]="hide() ? 'text' : 'password'"
          [(ngModel)]="password"
          #passwordModel="ngModel"
          placeholder="Password"
        />
        <mat-icon matSuffix (click)="togglePassword($event)">{{
          hide() ? 'visibility_off' : 'visibility'
        }}</mat-icon>
        @if (passwordModel.errors?.['required']) {
        <mat-error> Password is required </mat-error>
        }
      </mat-form-field>

      <button
        mat-raised-button
        [disabled]="!userForm.valid"
        type="submit"
        class="w-full mb-5 bg-blue-900 text-white rounded-md p-2"
      >
        Login
      </button>
    </div>
  </div>
</form>
